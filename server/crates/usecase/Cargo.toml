[package]
name = "uwuwu-usecase"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Юзкейсы uwuwu: оркестрация агрегатами + инфра-порты (задача hub#1133)."

# Слой юзкейсов: зависит ТОЛЬКО от домена. Инфра подводится реализациями
# портов в композиционном корне (uwuwu-server). Никаких anyhow: ошибки
# нативные (error::UsecaseError).

[dependencies]
uwuwu-domain = { path = "../domain" }
async-trait = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
