# uwuwu-server — конфиг контура (секреты — env, не здесь; канон живого прод-конфига, #1211-хвост)
# Путь к конфигу: env UWUWU_SERVER_CONFIG (дефолт server/config.toml).
#
# mode:
#   observe — тик читает доски и логирует решения, мутаций нет (обкатка)
#   live    — полный конвейер: спавны, будильники, автодон
mode = "observe"
poll_sec = 180
# клин холодного ящика (#1293): терминальные строки (Done/Deleted) старше
# N суток уходят в архив Projects v2 — снапшот несёт активный контур;
# 0 = выключен. observe-режим логирует кандидатов, мутаций нет
sweep_days = 7
# env-gc (#1431): снос env терминальных строк, чей issue закрыт строго
# старше N суток (2 = «строго больше 48 ч»); обязан быть меньше
# sweep_days — снос успевает до архивации строки в холодный ящик.
# 0 = выключен (kill-switch). Инвариант проверяется на старте
env_gc_days = 2
# observe-гейт env-gc: фаза пробы завершена (сутки observe-логов 21–22.11,
# санкция владельца «Сутки прошли почти газ») — с 22.11 снос LIVE.
# true = кандидаты в лог, команд нет (откат флипа этим ключом)
env_gc_observe = false
port = 8090

[hub]
repo = "yurvon-screamo/uwuwu-hub"
# токен: env GH_TOKEN

[executor]
name = "kisa"
url = "https://opencode.uwuwu.net"
# basic-пароль опенкода: env UWUWU_OPENCODE_PASSWORD

[executor.models]
default = "opencode-go/hy4-flash-free#high"
developer = "opencode-go/hy4-flash-free#high"
plan-reviewer = "zai-coding-plan/glm-5.4#high"
code-quality-reviewer = "zai-coding-plan/glm-5.4#high"
tester = "opencode-go/hy4-flash-free#high"
test-reviewer = "zai-coding-plan/glm-5.4#high"
analyst = "opencode-go/hy4-flash-free#high"
analyst-reviewer = "zai-coding-plan/glm-5.4#high"
dreamer = "opencode-go/hy4-flash-free#high"

[policy]
cup = 7
# пик-окно GLM: будни 06:00–10:00 UTC (минуты от полуночи UTC), off = false
peak = { enabled = true, start_min = 360, end_min = 600 }

# Автокомпакт (#1221 + #1607 срез 4): проход ботов + проход мастер-сессий
# аналитика. Доля 62% — санкция владельца 25.11 в #1607 (Common-1 р.4):
# знаменатель usage_pct — limit.context каталога исполнителя, срез 3 его
# переопределяет (flash 480k, 5.4 780k) → эффективные линии: боты ~298k
# (ниже нативной черты flash 380k), мастер-аналитик ~484k (ниже черты 680k).
[compact]
idle_min = 240
min_context_pct = 62.0
cooldown_min = 60

