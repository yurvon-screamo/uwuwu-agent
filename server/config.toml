# uwuwu-server — конфиг контура (секреты — env, не здесь; канон живого прод-конфига, #1211-хвост)
# Путь к конфигу: env UWUWU_SERVER_CONFIG (дефолт server/config.toml).
#
# mode:
#   observe — тик читает доски и логирует решения, мутаций нет (обкатка)
#   live    — полный конвейер: спавны, будильники, автодон
mode = "observe"
poll_sec = 180
# клин холодного ящика (#1293): терминальные строки (Done/Deleted) старше
# N суток уходят в архив Projects v2 — снапшот несёт активный контур;
# 0 = выключен. observe-режим логирует кандидатов, мутаций нет
sweep_days = 7
# env-gc (#1431): снос env терминальных строк, чей issue закрыт строго
# старше N часов (1 = «строго больше часа», решение владельца 27.11);
# обязан быть меньше sweep_days × 24 — снос успевает до архивации строки.
# 0 = выключен (kill-switch). Инвариант проверяется на старте
env_gc_hours = 1
# observe-гейт env-gc: фаза пробы завершена (сутки observe-логов 21–22.11,
# санкция владельца «Сутки прошли почти газ») — с 22.11 снос LIVE.
# true = кандидаты в лог, команд нет (откат флипа этим ключом)
env_gc_observe = false
port = 8090

[hub]
repo = "yurvon-screamo/uwuwu-hub"
# токен: env GH_TOKEN

[executor]
name = "kisa"
url = "https://opencode.uwuwu.net"
# basic-пароль опенкода: env UWUWU_OPENCODE_PASSWORD

# Алиасы моделей (#1684): raw-модель указывается один раз на алиасе.
# Уровни flash < common < smart; канон и оба файла конфига синхронны.
# По решению владельца (27.11) common = flash — совпадение временное,
# лестница алиасов и сдвиг сложности ±1 при этом сохраняются.
# Провайдер common — opencode-go, под peak GLM не попадает (#1680).
[executor.model_aliases]
flash = "opencode-go/hy4-flash-free#high"
common = "opencode-go/hy4-flash-free#high"
smart = "zai-coding-plan/glm-5.4#high"

# Агент/default → алиас. Raw-моделей здесь нет (#1684).
[executor.models]
default = "flash"
developer = "flash"
plan-reviewer = "smart"
code-quality-reviewer = "smart"
tester = "flash"
test-reviewer = "smart"
analyst = "flash"
analyst-reviewer = "smart"
dreamer = "common"

[policy]
# ВРЕМЕННО 20 на время разбора инцидентов 27.11 (вернуть 10!) — uwuwu #1707/#1708
cup = 20
# пик-окно провайдера zai-coding-plan (GLM): будни 06:00–10:00 UTC
# (минуты от полуночи UTC), off = false; этапы других провайдеров не откладываются (#1680)
peak = { enabled = true, start_min = 360, end_min = 600 }

# Автокомпакт (#1221 + #1607 срез 4): проход ботов + проход мастер-сессий
# аналитика. Доля 40% — санкция владельца 26.11 в #1676 (было 62% в #1607):
# знаменатель usage_pct — limit.context каталога исполнителя, срез 3 его
# переопределяет (flash 480k, 5.4 780k) → эффективные линии: боты ~192k
# (ниже нативной черты flash 380k), мастер-аналитик ~312k (ниже черты 680k).
[compact]
idle_min = 240
min_context_pct = 40.0
cooldown_min = 60

[[project]]
name = "uwuwu"
board = "Задачи uwuwu"
repo = "yurvon-screamo/uwuwu-agent"
# мастер-чекаут проекта на исполнителе (cwd bootstrap-сессии)
checkout = "/home/yurvon/uwuwu-agent"
# корень env задач на исполнителе (~/agents-env)
env_root = "/home/yurvon/agents-env"

# Подключены 16.11 (доски смигрированы: fm→колонки/поля, ∅→Todo); строки
# вне действующих стадий — конвейер не спавнит (владелец: «в работу не берём»).
# true-washing/foilcap — код вне GitHub: repo ниже = GitHub-каркас, его
# потребляет только PR-слой конвейера (автомерж-проба/мерж). Носители кода:
# foilcap — self-hosted Gitea git.l4a.ru/ek/ai-generator (checkout = Gitea-клон;
# перевод in-place, #1333); true-washing — Forgejo git.true-wash.com
# true-wash/detector (checkout = Forgejo-клон; #1333). Детали — их Деплоймент в вики.
[[project]]
name = "origa"
board = "Задачи origa"
repo = "yurvon-screamo/origa"
checkout = "/home/yurvon/origa"
env_root = "/home/yurvon/agents-env"

[[project]]
name = "true-washing"
board = "Задачи true-washing"
repo = "yurvon-screamo/true-washing"
checkout = "/home/yurvon/true-wash/detector"
env_root = "/home/yurvon/agents-env"

[[project]]
name = "foilcap"
board = "Задачи foilcap"
repo = "yurvon-screamo/foilcap"
checkout = "/home/yurvon/foilcap"
env_root = "/home/yurvon/agents-env"

# Мульти-экзекьютор (#1203): redmi — второй исполнитель (ноут-2, через релей).
# 1xgames: каркасное GitHub-репо (основной код в проприетарном GitLab,
# доступ только у redmi; агент в MR 1xGames не пишет — комменты владельца).
[[executors]]
name = "redmi"
url = "http://relay.railway.internal:2336"

[[project]]
name = "1xgames"
board = "Задачи 1xgames"
repo = "yurvon-screamo/1xgames"
checkout = "D:/1xgames/game-service"
env_root = "D:/agents-env"
executor = "redmi"

