# uwuwu-server — конфиг контура (канон-пример; секреты — env, не здесь)
# Путь к конфигу: env UWUWU_SERVER_CONFIG (дефолт server/config.toml).
#
# mode:
#   observe — тик читает доски и логирует решения, мутаций нет (обкатка)
#   live    — полный конвейер: спавны, будильники, автодон
mode = "observe"
poll_sec = 180
# клин холодного ящика (#1293): терминальные строки (Done/Deleted) старше
# N суток уходят в архив Projects v2; 0 = выключен
sweep_days = 7
# env-gc (#1431): снос env терминальных строк, чей issue закрыт строго
# старше N суток; обязан быть меньше sweep_days (старт-валидация).
# 0 = выключен; observe = true — кандидаты в лог, команд нет
env_gc_days = 0
env_gc_observe = true
port = 8090

[hub]
repo = "yurvon-screamo/uwuwu-hub"
# токен: env GH_TOKEN
# Gitea-инстансы PR-гейта: env GITEA_TOKENS («host=token,host=token», #1269);
# нет/пусто — Gitea-PR ждут владельца в Review (Foreign), деплой не ломается

[executor]
name = "kisa"
url = "https://opencode.uwuwu.net"
# basic-пароль опенкода: env UWUWU_OPENCODE_PASSWORD

# Карта моделей спавнов — единственный механизм конфигурации моделей
# (#1154, решение владельца 17.11): модель кладётся сервером в тело
# спавна; деф-файлы агентов (agents/*.md) моделей не несут.
# Формат: "provider/id[#variant]". Ключ "default" — Dev/Design/bootstrap.
# Отсутствие секции — канон владельца (SpawnModels::canonical).
[executor.models]
default = "zai-coding-plan/glm-5.3-flash#high"
developer = "zai-coding-plan/glm-5.3-flash#high"
plan-reviewer = "zai-coding-plan/glm-5.3#high"
code-quality-reviewer = "zai-coding-plan/glm-5.3#high"
tester = "zai-coding-plan/glm-5.3-flash#high"
test-reviewer = "zai-coding-plan/glm-5.3#high"
analyst = "zai-coding-plan/glm-5.3-flash#high"
analyst-reviewer = "zai-coding-plan/glm-5.3#high"
dreamer = "zai-coding-plan/glm-5.3-flash#high"

[policy]
cup = 7
# пик-окно GLM: будни 06:00–10:00 UTC (минуты от полуночи UTC), off = false
peak = { enabled = true, start_min = 360, end_min = 600 }

# Инцидент-сигнализация сталл-детекта (#1281): N+ эскалаций за скользящее
# окно — один ТГ-сигнал владельцу. Секция не задана — off.
# [notify]
# tg_token_env = "UWUWU_NOTIFY_TG_TOKEN"
# tg_chat_id = 0

# Автокомпакт вечных сессий ТГ-ботов (#1221, ADR-082): тик супервизора
# при неактивности ≥ idle_min и занятости окна контекста ≥ min_context_pct
# % лимита модели стреляет нативным compact опенкода (doc-сессии ботов
# дозаправляют методичку после компакта). Секция не задана — off;
# значения ниже — дефолты кода (idle/pct — числа владельца из постановки
# ADR-082, коулдаун — реализация ADR-082; провенанс разведён — L3 #1221).
# [compact]
# idle_min = 240
# min_context_pct = 40.0
# cooldown_min = 60

[[project]]
name = "uwuwu"
board = "Задачи uwuwu"
repo = "yurvon-screamo/uwuwu-agent"
# мастер-чекаут проекта на исполнителе (cwd bootstrap-сессии)
checkout = "/home/yurvon/uwuwu-agent"
# корень env задач на исполнителе (~/agents-env)
env_root = "/home/yurvon/agents-env"

# Подключены 16.11 (доски смигрированы: fm→колонки/поля, ∅→Todo); строки
