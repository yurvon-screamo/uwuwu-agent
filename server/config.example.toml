# uwuwu-server — конфиг контура (канон-пример; секреты — env, не здесь)
# Путь к конфигу: env UWUWU_SERVER_CONFIG (дефолт server/config.toml).
#
# mode:
#   observe — тик читает доски и логирует решения, мутаций нет (обкатка)
#   live    — полный конвейер: спавны, будильники, автодон
mode = "observe"
poll_sec = 180
# клин холодного ящика (#1293): терминальные строки (Done/Deleted) старше
# N суток уходят в архив Projects v2; 0 = выключен
sweep_days = 7
# env-gc (#1431): снос env терминальных строк, чей issue закрыт строго
# старше N часов; обязан быть меньше sweep_days × 24 (старт-валидация).
# 0 = выключен; observe = true — кандидаты в лог, команд нет
env_gc_hours = 0
env_gc_observe = true
port = 8090

[hub]
repo = "yurvon-screamo/uwuwu-hub"
# токен: env GH_TOKEN
# Gitea-инстансы PR-гейта: env GITEA_TOKENS («host=token,host=token», #1269);
# нет/пусто — Gitea-PR ждут владельца в Review (Foreign), деплой не ломается

[executor]
name = "kisa"
url = "https://opencode.uwuwu.net"
# basic-пароль опенкода: env UWUWU_OPENCODE_PASSWORD

# Карта моделей спавнов — единственный механизм конфигурации моделей
# (#1154, решение владельца 17.11): модель кладётся сервером в тело
# спавна; деф-файлы агентов (agents/*.md) моделей не несут.
# Алиасы (#1684): raw-модель — на алиасе, агент ссылается на алиас.
# Формат raw: "provider/id[#variant]". Отсутствие секции — канон владельца.
# По решению владельца (27.11) common = flash — совпадение временное,
# лестница алиасов и сдвиг сложности ±1 при этом сохраняются.
[executor.model_aliases]
flash = "opencode-go/hy4-flash-free#high"
common = "opencode-go/hy4-flash-free#high"
smart = "zai-coding-plan/glm-5.4#high"

# Ключ "default" — bootstrap-сессии; рабочие Design/Dev пишут "developer".
[executor.models]
default = "flash"
developer = "flash"
plan-reviewer = "smart"
code-quality-reviewer = "smart"
tester = "flash"
test-reviewer = "smart"
analyst = "flash"
analyst-reviewer = "smart"
dreamer = "common"

[policy]
cup = 10
# пик-окно провайдера zai-coding-plan (GLM): будни 06:00–10:00 UTC
# (минуты от полуночи UTC), off = false; этапы других провайдеров не откладываются (#1680)
peak = { enabled = true, start_min = 360, end_min = 600 }

# Инцидент-сигнализация сталл-детекта (#1281): N+ эскалаций за скользящее
# окно — один ТГ-сигнал владельцу. Секция не задана — off.
# [notify]
# tg_token_env = "UWUWU_NOTIFY_TG_TOKEN"
# tg_chat_id = 0

# Проба квоты подписки провайдера моделей (#1477): гейт лимитной тишины —
# исчерпание 5h-окна подписки ставит строки на паузу без пингов/эскалаций,
# самовозобновление после спада процента; один ТГ-сигнал на окно.
# Ключ: env по api_key_env (нет ключа при включённой секции — громкий
# старт-отказ). Привязка к провайдеру — только эта секция (за трейтом).
# Секция не задана — off (safe default).
# [quota]
# base_url = "https://api.z.ai"
# path = "/api/monitor/usage/quota/limit"
# api_key_env = "UWUWU_ZAI_API_KEY"

# Судья конвейера (#1364): decision-модель статусных решений на сталл- и
# кап-точках — вместо автопингов/автопаркинга. Ключ: env GEMINI_API_KEY
# (нет ключа при enabled=true — контур off с громким warn). Секция не
# задана / enabled=false — off (opt-in владельца).
# [judge]
# enabled = true
# model = "gemini-decision-1"
# every_ms = 7200000        # интервал повторных вызовов на одной тишине
#                           # (0 — решение на каждом сталл-тике: жжёт квоту)
# escalate_after = 3        # гвард: вызовов без смены статуса до паркинга
#                           # (0 — гвард выключен: судья решает бесконечно)
# comments_tail = 4         # комментов в контексте
# comment_max_chars = 1500
# body_max_chars = 6000     # тела бывают 10–40k — TPM-дисциплина
# msg_max_chars = 800       # трим ассистентского ответа в хвосте сессии
# rpm_limit = 5             # полоса вызовов (в минуту) — квоты тира волны

# Автокомпакт (#1221 + #1607 срез 4): тик супервизора при неактивности
# ≥ idle_min и занятости окна контекста ≥ min_context_pct % лимита модели
# стреляет нативным compact опенкода (doc-сессии ботов дозаправляют
# методичку после компакта; мастер-сессии аналитики — срез 4 #1607).
# Секция не задана — off; значения ниже — числа владельца
# (idle/pct — постановка ADR-082; коулдаун — реализация ADR-082;
# провенанс разведён — L3 #1221; доля 40% — санкция 26.11 в #1676).
# [compact]
# idle_min = 240
# min_context_pct = 40.0
# cooldown_min = 60

