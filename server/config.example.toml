# uwuwu-server — конфиг контура (канон-пример; секреты — env, не здесь)
# Путь к конфигу: env UWUWU_SERVER_CONFIG (дефолт server/config.toml).
#
# mode:
#   observe — тик читает доски и логирует решения, мутаций нет (обкатка)
#   live    — полный конвейер: спавны, будильники, автодон
mode = "observe"
poll_sec = 180
port = 8090

[hub]
repo = "yurvon-screamo/uwuwu-hub"
# токен: env GH_TOKEN

[executor]
name = "kisa"
url = "https://opencode.uwuwu.net"
# basic-пароль опенкода: env UWUWU_OPENCODE_PASSWORD

[executor.spawn_model]
provider = "zai-coding-plan"
id = "glm-5.3-flash"

[policy]
cup = 7
# пик-окно GLM: будни 06:00–10:00 UTC (минуты от полуночи UTC), off = false
peak = { enabled = true, start_min = 360, end_min = 600 }

[[project]]
name = "uwuwu"
board = "Задачи uwuwu"
repo = "yurvon-screamo/uwuwu-agent"
# мастер-чекаут проекта на исполнителе (cwd bootstrap-сессии)
checkout = "/home/yurvon/uwuwu-agent"
# корень env задач на исполнителе (~/agents-env)
env_root = "/home/yurvon/agents-env"
