[workspace]
resolver = "2"
members = ["crates/domain", "crates/usecase", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# blob-канал #1292: Tigris S3 (SigV4 sans-IO; rustcrypto — без xml/md-5/full,
# тулам нужны только GetObject/PutObject + presign) + дедуп-хэш + base64-вход
rusty-s3 = { version = "0.12", default-features = false, features = ["rustcrypto"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.23"
# dev
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
