[package]
name = "uwuwu-cli"
version = "0.5.0"
edition = "2021"
description = "CLI for uwuwu/wiki: semantic search over experience, access docs, projects listing"

[[bin]]
name = "uwuwu-cli"
path = "src/main.rs"

[lib]
name = "uwuwu_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", features = ["json", "cookies", "multipart"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
serial_test = "4"
wiremock = "0.6"

[profile.release]
opt-level = 3

[profile.dev]
debug = "line-tables-only"
