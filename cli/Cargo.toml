[package]
name = "uwuwu-cli"
version = "0.5.0"
edition = "2021"
description = "CLI for uwuwu/wiki: semantic search over experience, access docs, projects listing"

[[bin]]
name = "uwuwu-cli"
path = "src/main.rs"

[lib]
name = "uwuwu_cli"
path = "src/lib.rs"

[dependencies]
# ANSI-цвета выключены глобально (default-features выключены ради фичи color): cli используется только агентами
# (задача 20261110104429-ml41jc8) — help/ошибки монохромны и в TTY, и в пайпе.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", features = ["json", "cookies", "multipart"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
e2e-github = []

[dev-dependencies]
tempfile = "3"
serial_test = "4"
wiremock = "0.6"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3

[profile.dev]
debug = "line-tables-only"
