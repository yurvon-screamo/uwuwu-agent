# Ретеншен журнала journald для форензики siyuan-demo (uwuwu).
# Куда: /etc/systemd/journald.conf.d/50-uwuwu-journal-retention.conf (sudo).
# Почему: пакет cachyos-settings ставит SystemMaxUse=50M на весь
# /var/log/journal (/usr/lib/systemd/journald.conf.d/00-journal-size.conf) —
# user-журнал при 50M вакуумируется за часы, логи смертей процесса ядра
# siyuan-demo терялись до того, как по ним успевали форензить
# (задача 20261109083919-v5mlahe, класс рецидива 05.11/08.11).
# 1G при текущей нагрузке (~5–10M/ч ночью) — запас 5–10 суток против
# целевых «сутки-двое». Установка и проверка — README.md этой папки.

[Journal]
SystemMaxUse=1G
