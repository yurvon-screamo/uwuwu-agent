# CI: параллельные джобы (fmt / clippy / test / plugins / qlty) +
# агрегатор «CI». Required-чек branch protection матчит имя «CI»
# посимвольно (инцидент: джоба без name давала чекран «ci» и гейт
# блокировал все PR) — агрегатор сохраняет контракт имени, краснея
# от любого упавшего входа, а тяжёлые чеки идут параллельно.
#
# Зачем push на master (кейс #221): батч-мерджи вносят артефакты,
# невидимые на PR-ветках. Push-ран мастер-коммита ловит их в момент
# мерджа; merge queue отвергнута (детекция достаточна).
name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  fmt:
    name: rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: cargo fmt --check (cli, server)
        run: |
          for d in cli server; do (cd "$d" && cargo fmt --check); done

  clippy:
    name: rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: cli,server
      # protoc: lance-стек (prost-build); свежий бинаррь с GitHub + include/*
      # (well-known типы: deb-пакет старый и не находит empty.proto)
      - name: Install protoc
        run: |
          PB_REL="https://github.com/protocolbuffers/protobuf/releases"
          PB_VER="29.3"
          curl -sSL "$PB_REL/download/v${PB_VER}/protoc-${PB_VER}-linux-x86_64.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version
      - name: cargo clippy (cli, server)
        run: |
          for d in cli server; do (cd "$d" && cargo clippy --all-targets -- -D warnings); done

  test:
    name: rust test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: cli,server
      - name: Install protoc
        run: |
          PB_REL="https://github.com/protocolbuffers/protobuf/releases"
          PB_VER="29.3"
          curl -sSL "$PB_REL/download/v${PB_VER}/protoc-${PB_VER}-linux-x86_64.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version
      - name: cargo test (cli, server)
        # e2e-тесты ходят в живой hub и гвардятся UWUWU_E2E_GITHUB=1:
        # без переменной сразу зелёные (cli/tests/*_e2e.rs)
        run: |
          for d in cli server; do (cd "$d" && cargo test); done

  plugins:
    name: plugins (bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # TS-слой после сноса демон-контура (#1133): живой TS — только плагины
      # опенкода (plugins/ + lib/). Пин версии = версия машин разработчиков.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: bun install (plugins)
        run: cd plugins && bun install --frozen-lockfile
      - name: typecheck (tsc --noEmit, plugins)
        run: cd plugins && bun run typecheck
      # юнит-тесты плагин-модулей (lib/*.test.ts): чистые функции без сети
      - name: bun test
        run: bun test lib/

  qlty:
    name: qlty (delta)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — нужна дельта origin/master...HEAD
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install qlty
        run: curl -sSfL https://qlty.sh | sh
      # Настоящая строковая дельта против upstream (нативный режим qlty):
      # находки только в добавленных/изменённых строках PR — pre-existing
      # baseline-долг тронутого файла CI не красит (инцидент PR #158).
      # Семантика merge-base: отставшая ветка сравнивается с точкой форка.
      # Готча: «No modified files» в tracked-чекаутах — диагностическая
      # строка, скоуп --upstream-прогона не отменяет.
      - name: qlty check
        run: $HOME/.qlty/bin/qlty check --no-fix --no-progress --upstream origin/master

  # Агрегатор: держит required-контекст «CI» (branch protection матчит
  # имя) — краснеет от любого упавшего входа, сам ничего не исполняет.
  CI:
    name: CI
    needs: [fmt, clippy, test, plugins, qlty]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Gate
        env:
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          TEST: ${{ needs.test.result }}
          PLUGINS: ${{ needs.plugins.result }}
          QLTY: ${{ needs.qlty.result }}
        run: |
          for name in FMT CLIPPY TEST PLUGINS QLTY; do
            r="${!name}"
            if [ "$r" != "success" ]; then
              echo "упавший вход: $name=$r"
              exit 1
            fi
          done
          echo "все входы зелёные"
