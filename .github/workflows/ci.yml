# CI: fmt + clippy + test + qlty (delta) — на PR и на мастер-пуше.
# Без concurrency: cancel-in-progress ест свои раны (опыт origa, док cicd).
# Required-чек branch protection «CI» прицепляется именно к PR-ранам —
# push-ран мастер-коммита гейтом PR не становится, он валидирует сам мердж.
#
# Зачем push на master (кейс #221): батч-мерджи вносят артефакты, невидимые
# на PR-ветках — каждый PR-ран гоняет merge-коммит со своей копией master,
# и зелёные по отдельности диффы двух PR конфликтуют только на
# мастер-коммите (дубль strictPathPin, TS2300 — всплыл красным CI чужого
# PR #224, hotfix cee4c0c). Push-ран мастер-коммита ловит это в момент
# мерджа. Развилка «merge queue» (предотвращение до мастера) отвергнута:
# сериализация мерджей и пересборка autodone-механики против редкого
# эпизода — детекция достаточна (линия stress-tests.yml: сигнал =
# красная джоба + нативный email GitHub, автозаведение задач не строим).
#
# Красный push-ран — не всегда батч-артефакт: семейство тайминг-флейков
# cargo test (search_lines #145, mcp_transport, semantic_tests #195) изредка
# красит и мастер-раны. Отличие: флейк исчезает на перезапуске
# (gh run rerun), батч-артефакт воспроизводится.
name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    # Чекран называется по job name (не по id): required-контекст в branch
    # protection — «CI», GitHub матчит посимвольно (инцидент: джоба без name
    # давала чекран «ci» и гейт блокировал вообще все PR).
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 — нужна дельта origin/master...HEAD для qlty
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Пины по SHA: плавающие теги = supply-chain поверхность и
      # невоспроизводимость ранов (правило ревью workflows, образец — origa).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: cli

      - name: cargo fmt
        working-directory: cli
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: cli
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # e2e-тесты ходят в живой hub (uwuwu-hub) и гвардятся UWUWU_E2E_GITHUB=1:
        # без переменной они сразу зелёные (см. cli/tests/*_e2e.rs).
        working-directory: cli
        run: cargo test

      # TS-слой (plugins + пер-директорные агенты): tsc-гейт и bun-тесты.
      # Пин версии = версия машин разработчиков (локи сгенерированы ею);
      # плавающий latest = невоспроизводимые раны.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: bun install (ts-контуры)
        run: |
          for d in plugins factory cron dreamer triage; do
            (cd "$d" && bun install --frozen-lockfile)
          done

      - name: typecheck (tsc --noEmit, все ts-контуры)
        run: |
          for d in plugins factory cron dreamer triage; do
            (cd "$d" && bun run typecheck)
          done

      # bun test из корня гоняет все контуры (lib/tests + тесты агентов);
      # интеграционные тесты само-гвардятся и скипаются без живого ядра.
      - name: bun test
        run: bun test

      - name: Install qlty
        run: curl -sSfL https://qlty.sh | sh

      - name: qlty check (delta)
        # Настоящая строковая дельта против upstream (нативный режим qlty):
        # находки репортятся только в добавленных/изменённых строках PR —
        # pre-existing baseline-долг тронутого файла CI не красит (инцидент
        # PR #158: 8 pre-existing находок lib/hub.ts на файл-скоупе).
        # Семантика merge-base: отставшая ветка сравнивается с
        # точкой форка, чужие изменения master не красят. Пустая дельта
        # обрабатывается нативно («No modified files», exit 0) — git-обёртка
        # со списком путей не нужна; механика — живые пробы от 08.11,
        # опыт /tools/«qlty CI Gate Analysis». Готча чтения вывода:
        # строка «No modified files» в tracked-чекаутах диагностическая,
        # скоуп --upstream-прогона не отменяет.
        run: $HOME/.qlty/bin/qlty check --no-fix --no-progress --upstream origin/master
