# CI: параллельные джобы (fmt / clippy+test / plugins / qlty) + агрегатор «CI».
#
# Path-фильтры (15.11, «нахуй для баша ждать сборку сервера»): джоба
# changes считает дифф origin/master...HEAD и включает только джобы
# затронутых областей — правка entrypoint.sh/Dockerfile не ждёт
# rust-компиляцию. Исключения, где гоняем ВСЁ:
#   - push-ран мастер-коммита: его работа — ловить батч-артефакты,
#     невидимые на PR-ветках (кейс #221: зелёные по отдельности диффы
#     конфликтуют на merge-коммите) — скип здесь открывал бы дыру;
#   - правка самого ci.yml — самопроверка.
# Агрегатор «CI» держит required-контекст branch protection (гейт
# матчит имя посимвольно) и принимает success|skipped, краснея от
# failure|cancelled.
# Autodeploy (#1211): контракт deploy-джобы — в её блоке ниже.
name: CI

# ВРЕМЕННО ОТКЛЮЧЕН (17.11, биллинг Actions исчерпан — PR-ивенты не создают
# ранов, #1238/#1239): авто-триггеры сняты, запуск только вручную
# (workflow_dispatch). Вернуть on: pull_request + push при восстановлении
# биллинга — но СНАЧАЛА снести deploy-джобу (см. её блок): активным носителем
# автодеплоя uwuwu-server является Railway GitHub-интеграция (source.repo,
# root server/, watch server/**, #1211) — возврат триггеров без сноса джобы
# даст двойной деплой на каждый сервер-мерж, а сама джоба упадёт на
# отсутствующий RAILWAY_TOKEN (секрет не заведён). Локальная верификация
# обязательна: cargo fmt/clippy/test + qlty.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      plugins: ${{ steps.areas.outputs.plugins }}
      server_deploy: ${{ steps.areas.outputs.server_deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff → области
        id: areas
        env:
          # SHA мастер-коммита ДО пуша (для deploy-диффа); пустой/нулевой
          # SHA (форс-пуш) — гард ниже падает на HEAD^.
          PUSH_BASE: ${{ github.event.before }}
        run: |
          run_all=0
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            run_all=1
          fi
          if git diff --name-only origin/master...HEAD | grep -qF '.github/workflows/ci.yml'; then
            run_all=1
          fi
          if [ "$run_all" = 1 ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          else
            files="$(git diff --name-only origin/master...HEAD)"
            rust=false
            plugins=false
            while IFS= read -r f; do
              case "$f" in
                server/crates/*|server/Cargo.toml|server/Cargo.lock) rust=true ;;
                plugins/*|lib/*) plugins=true ;;
              esac
            done <<< "$files"
            echo "rust=$rust" >> "$GITHUB_OUTPUT"
            echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          fi
          # server_deploy (#1211): только на push-ране мастера, дифф пуша
          # (PUSH_BASE..HEAD — устойчив к merge-commit/squash/rebase и
          # мульти-коммитным пушам; форс-пуш — фоллбек HEAD^) по входам
          # образа server/Dockerfile. На PR всегда false — деплой не на PR.
          server_deploy=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base="$PUSH_BASE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              base="HEAD^"
            fi
            while IFS= read -r f; do
              case "$f" in
                server/crates/*|server/Cargo.toml|server/Cargo.lock|server/Dockerfile|server/config.example.toml) server_deploy=true ;;
              esac
            done <<< "$(git diff --name-only "$base..HEAD")"
          fi
          echo "server_deploy=$server_deploy" >> "$GITHUB_OUTPUT"

  fmt:
    name: rust fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: cargo fmt --check (server)
        run: cd server && cargo fmt --check

  rust:
    # clippy+test в одной джобе: депы (lance-стек, ~600 крейтов)
    # компилируются ОДИН раз, test переиспользует target/ от clippy —
    # раздельные джобы удваивали компиляцию и GitHub Actions usage
    name: rust clippy+test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: server
          # общий ключ между ранами/ветками одного workflow: депы из
          # Cargo.lock стабильны — холодная пересборка только при смене lock
          shared-key: rust-ci-deps
          cache-on-failure: true
      # protoc: lance-стек (prost-build); свежий бинаррь с GitHub + include/*
      # (well-known типы: deb-пакет старый и не находит empty.proto)
      - name: Install protoc
        run: |
          PB_REL="https://github.com/protocolbuffers/protobuf/releases"
          PB_VER="29.3"
          curl -sSL "$PB_REL/download/v${PB_VER}/protoc-${PB_VER}-linux-x86_64.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version
      - name: cargo clippy (server)
        run: cd server && cargo clippy --all-targets -- -D warnings
      - name: cargo test (server)
        run: cd server && cargo test

  plugins:
    name: plugins (bun)
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # TS-слой после сноса демон-контура (#1133): живой TS — только плагины
      # опенкода (plugins/ + lib/). Пин версии = версия машин разработчиков.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: bun install (plugins)
        run: cd plugins && bun install --frozen-lockfile
      - name: typecheck (tsc --noEmit, plugins)
        run: cd plugins && bun run typecheck
      # юнит-тесты плагин-модулей (lib/*.test.ts): чистые функции без сети
      - name: bun test
        run: bun test lib/

  qlty:
    # всегда: qlty сам сканирует дифф изменённых строк (нативный upstream),
    # отдельная джоба дешёвая (секунды) и независимо полезна
    name: qlty (delta)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — нужна дельта origin/master...HEAD
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install qlty
        run: curl -sSfL https://qlty.sh | sh
      # Настоящая строковая дельта против upstream (нативный режим qlty):
      # находки только в добавленных/изменённых строках PR — pre-existing
      # baseline-долг тронутого файла CI не красит (инцидент PR #158).
      # Семантика merge-base: отставшая ветка сравнивается с точкой форка.
      # Готча: «No modified files» в tracked-чекаутах — диагностическая
      # строка, скоуп --upstream-прогона не отменяет.
      - name: qlty check
        run: $HOME/.qlty/bin/qlty check --no-fix --no-progress --upstream origin/master

  # Autodeploy uwuwu-server (#1211): только на push-ране мастера и только
  # при изменении входов образа (server_deploy из changes). Гейт — полный
  # Rust-контур (fmt + rust); упавший need скипает джобу каскадом needs.
  # В needs агрегатора «CI» не входит — required-контекст мержей не трогает:
  # красный деплой ловится красным мастер-раном + email (ADR-097).
  deploy:
    name: deploy (Railway)
    needs: [changes, fmt, rust]
    if: github.event_name == 'push' && needs.changes.outputs.server_deploy == 'true'
    runs-on: ubuntu-latest
    # холодный билд Railway ~17-20 мин (#1162) + запас
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # Пин версии = пин локального CLI владельца (Railway CLI Operations)
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.74.0
      # Без .railway.json в репо — явные -p/-e/-s обязательны (Railway CLI
      # Operations: «вне linked-каталога всегда передавай -p, -e, -s»).
      # Без -d: джоба ждёт результат билда — красная джоба = честный
      # упавший деплой, а не зелёная с синхронным аплоадом.
      - name: railway up --ci (server)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: cd server && railway up --ci --project uwuwu --environment production --service uwuwu-server

  # Агрегатор: держит required-контекст «CI» (branch protection матчит
  # имя) — краснеет от любого упавшего входа, пропускает скипнутые
  # (path-фильтр: область не затронута), сам ничего не исполняет.
  CI:
    name: CI
    needs: [changes, fmt, rust, plugins, qlty]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Gate
        env:
          CHANGES: ${{ needs.changes.result }}
          FMT: ${{ needs.fmt.result }}
          RUST: ${{ needs.rust.result }}
          PLUGINS: ${{ needs.plugins.result }}
          QLTY: ${{ needs.qlty.result }}
        run: |
          for name in CHANGES FMT RUST PLUGINS QLTY; do
            r="${!name}"
            case "$r" in
              success|skipped) ;;
              *)
                echo "вход не прошёл: $name=$r"
                exit 1
                ;;
            esac
          done
          echo "все затронутые входы зелёные"
