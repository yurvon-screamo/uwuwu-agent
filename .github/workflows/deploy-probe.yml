# Разовая проба автодеплой-механики (#1211): тот же деплой-шаг, что боевой
# deploy-джобе ci.yml, но триггер — push ветки задачи с правкой самого
# probe-файла. Push-событие резолвит воркфлоу из пуш-коммита (в отличие от
# workflow_dispatch, требующего файл на дефолт-ветке) — проба достижима до
# мержа. Сносящий коммит снимает файл до мержа PR — на master проба не
# попадает; снос пробы не триггерит (воркфлоу из пуш-коммита, где файла
# уже нет). Server-контент ветки идентичен master (задача правит только
# .github/ и lib/): деплой уезжает текущим мастер-контентом образа.
name: deploy probe

on:
  push:
    branches:
      - work/task-1211
    paths:
      - '.github/workflows/deploy-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: railway up (probe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.74.0
      - name: railway up --ci (server)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: cd server && railway up --ci --project uwuwu --environment production --service uwuwu-server
