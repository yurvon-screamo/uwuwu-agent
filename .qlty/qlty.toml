config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "bandit"

[[plugin]]
name = "clippy"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-python"
mode = "comment"

# Тест-харнесс MCP-контракта (test_mcp_errors) и organize-команд wiki_ops
# (test_wiki_ops_unlink): bandit не применим (assert — механика проверок
# B101, subprocess/tmp — e2e-инфраструктура B404/B603/B108); radarlint
# S5754 требует bare raise в except — тест переводит SystemExit старого
# контракта в ясный провал теста, bare raise здесь неверен; S1186 —
# пустые методы моков (close) и есть реализация «ничего не делать»
[[exclude]]
plugins = ["bandit", "radarlint-python"]
file_patterns = ["tools/test_mcp_errors.py", "tools/test_wiki_ops_unlink.py"]

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"
