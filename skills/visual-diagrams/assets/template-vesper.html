<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Тема Vesper (тёмная AFFiNE) — только стиль, контент и макет свои.
   Известно-рабочая база: эти переменные и типографика рендерятся в embed_html. */
:root{
  --bg:#101010;        /* фон */
  --panel:#181818;     /* панель */
  --panel2:#1E1E1E;    /* панель 2 */
  --line:#2E2E2E;      /* линии */
  --fg:#FFFFFF;        /* текст */
  --mut:#A0A0A0;       /* приглушённый */
  --dim:#7E7E7E;       /* тусклый */
  --peach:#FFC799;     /* главный акцент */
  --mint:#99FFE4;      /* успех/строки */
  --purple:#ACA1CF;    /* структуры */
  --rose:#F5A191;      /* ошибки */
  --gold:#FFCFA8;      /* предупреждения */
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:14px/1.5 -apple-system,'Segoe UI',sans-serif;padding:4px}
code,pre{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</head>
<body>
<!-- контент — твой: макет, фигуры, анимации под содержание -->
</body>
</html>
