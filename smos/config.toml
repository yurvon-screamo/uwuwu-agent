# SMOS proxy default configuration.
# Copy/edit next to the binary (or pass via a custom path) and run:
#   cargo run --bin smos -- serve
# Any section omitted here falls back to the built-in defaults in
# smos-adapters/src/config.rs.
#
# This same file is installed verbatim under ~/.smos/config.toml by
# `smos init` — re-running `smos init` is idempotent and NEVER overwrites an
# existing config.

[surreal]
# Defaults to ~/.smos/db/smos.db (resolved by SmosPaths at startup). Override
# only when you need to point at a different RocksDB path.
# path = "~/.smos/db/smos.db"
namespace = "smos"
database = "smos"

[server]
host = "127.0.0.1"
port = 8888
shutdown_extraction_grace_seconds = 30
enable_response_extraction = true
graceful_degradation = true
log_format = "json"

# ---------------------------------------------------------------------------
# Providers — OpenAI-compatible LLM chat-completion endpoints.
# ---------------------------------------------------------------------------
#
# Each entry is one upstream (llama-server, OpenRouter, OpenAI, vLLM, …). The
# proxy forwards every chat-completion request to exactly one provider,
# chosen by the [persons.*] map. There is no round-robin / failover any more:
# routing is per-person, not per-pool.

[[providers]]
name = "llama-local"
url = "http://localhost:28082/v1/chat/completions"
api_key_env = ""                    # env var name; empty = no auth header sent
# auth_header = "Authorization"     # default; set to "api-key" for Azure
# timeout_seconds = 120             # default
# Forward admission gate — bounds in-flight NON-STREAMING forwards so they
# cannot pile up beyond the upstream's real parallelism and starve each other
# or background extraction. A saturated gate rejects with HTTP 503 +
# Retry-After. Streaming forwards bypass the gate.
#
# Defaults assume the default single-slot upstream (llama-server -np 1):
#   max_concurrent_forwards = 1         # one in-flight forward (matches -np 1)
#   forward_admission_timeout_ms = 2000 # 503 Retry-After window (ms)
# Raise max_concurrent_forwards in lockstep with the upstream's -np N (or a
# multi-slot cloud endpoint) so the gate never queues beyond real capacity.

# OpenRouter — multi-model cloud aggregator. The API key is read from the
# env var named below; never inline the literal key in this file.
[[providers]]
name = "openrouter"
url = "https://openrouter.ai/api/v1/chat/completions"
api_key_env = "OPENROUTER_API_KEY"     # env var name; empty = unauthenticated
max_concurrent_forwards = 1024            # multi-slot cloud endpoint
# forward_admission_timeout_ms = 2000  # default 503 Retry-After window (ms)

# Z.AI (Zhipu / GLM) — GLM Coding Plan PaaS endpoint. OpenAI-compatible.
# Upstream model ids: glm-4.6, glm-4.5, glm-4.5-air, etc.
[[providers]]
name = "zai"
url = "https://api.z.ai/api/coding/paas/v4/chat/completions"
api_key_env = "ZHIPU_API_KEY"          # env var name; Bearer token sent
auth_header = "Authorization"          # Z.AI uses Authorization: Bearer
max_concurrent_forwards = 8            # multi-slot cloud endpoint
# forward_admission_timeout_ms = 2000  # default 503 Retry-After window (ms)

# ---------------------------------------------------------------------------
# Persons — LLM personas = memory keys.
# ---------------------------------------------------------------------------
#
# A person is simultaneously:
#   - a memory key (the namespace under which extracted facts land),
#   - a provider + upstream model (the routing target),
#   - an optional persona .md (prepended to the request as a system message).
#
# Clients send `{"model": "<person-name>", ...}`; the proxy rewrites
# `request.model` to the upstream model declared below before forwarding.

[persons.uwuwu]
provider = "openrouter"            # MUST match a [[providers]].name
model = "poolside/laguna-xs-2.1:free"                # upstream model id
persona = "~/.smos/persons/uwuwu.md"  # optional; `~` expands to user home

# Example second person.
# [persons.alice]
# provider = "openrouter"
# model = "z-ai/glm-5.2"
# persona = "~/.smos/persons/alice.md"

# ---------------------------------------------------------------------------
# LLM for fact extraction (Qwen3.5-2B-MTP or any OpenAI-compatible model
# served by `llama-server`).
# ---------------------------------------------------------------------------
[llm_extraction]
url = "http://localhost:28082"           # API base (the adapter appends /v1/chat/completions)
model = "qwen3.5-2b"
api_key = ""                            # optional, for cloud providers
# absorbs long-prompt extraction (prompt-processing + generation > 30s at 5K+ tokens)
timeout_seconds = 180
# hard stop against Qwen3.5-2B thinking loops (per model card); 4096 fits 50+ facts
max_tokens = 4096
# Deterministic extraction: temperature=0 disables random sampling, seed pins
# the RNG so two runs against the same input re-yield the same bullet list.
# This is what keeps FactId = SHA1(content) stable across re-extraction runs.
temperature = 0.0
seed = 42

# Embedding model for vector search (may be a different provider than the
# extraction LLM).
[embedding]
url = "http://localhost:28081"           # the adapter appends /v1/embeddings
model = "hf.co/jinaai/jina-embeddings-v5-text-nano-retrieval-GGUF:Q8_0"
dimensions = 768                           # MUST match the HNSW index DDL
api_key = ""
timeout_seconds = 30

# Reranker — required for enrichment.
# The enrich pipeline reranks vector-search survivors via a cross-encoder
# before injecting them into the request. Without a reachable reranker,
# enrichment returns HTTP 503 (no fallback to vector-order-only ranking).
# Start the llama.cpp reranker with the working Qwen3-Reranker GGUF build:
#   ./llama-server --model qwen3-reranker-0.6b-q8_0.gguf --port 28181 \
#     --reranking --pooling rank --embedding
# The adapter expects an OpenAI-compatible /v1/rerank endpoint.
[reranker]
url = "http://localhost:28181"
model = "qwen3-reranker"
timeout_seconds = 60

[retrieval]
top_k_initial = 50
top_k_final = 5
min_confidence = 0.7
min_topic_chars = 3
# Floor on the cross-encoder rerank score (NOT cosine confidence). Facts
# whose rerank score falls below this are dropped in both `smos search` and
# chat enrichment, so a broken or weak reranker cannot surface garbage
# (0.001-0.003) into the search output or the injected memory block.
# Default 0.05 is conservative: relevant rerank scores are typically 0.8+
# and garbage is ~0.003, so the gap is huge. Set to 0.0 to disable.
min_relevance_score = 0.05

[merge]
cosine_threshold = 0.85

[confidence]
base = 0.5
multi_source_bonus = 0.2
no_contradiction_bonus = 0.1
accept_threshold = 0.7
pending_threshold = 0.4

# NLI verdict thresholds (domain layer). Drives the `is_contradiction` /
# `is_entailment` / `decide_merge` predicates. Soft caps so a borderline
# softmax distribution does not flip a verdict.
[nli]
contradiction_threshold = 0.5
entailment_threshold = 0.6

# Native ort + ONNX Runtime backend for NLI inference — adapter-only sibling
# of `[nli]`. The model id and cache directory are interpreter-level data
# that the domain layer never reads; keeping them under their own section
# preserves the layering invariant ("domain types carry no IO-boundary
# data"). Putting `model` / `cache_dir` under `[nli]` is a loud startup
# error — both sections carry `#[serde(deny_unknown_fields)]`, so the
# parser rejects the misplacement instead of silently dropping it.
[nli_backend]
model = "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
# Defaults to ~/.smos/models; uncomment to override.
# cache_dir = "~/.smos/models"
# Device selection policy. "auto" probes the host at startup (DirectML on
# Windows, CUDA on Linux, Metal on macOS, CPU otherwise). Override with one
# of "cpu" / "directml" / "cuda" / "metal" to force a specific device.
device = "auto"
# Where the matching ONNX Runtime shared library is cached. One subdirectory
# per device (`cpu/`, `cuda/`, `directml/`, `metal/`).
# ort_cache_dir = "~/.smos/models/ort"

# Semantic dedup safety net for fact extraction (persist_facts step 2).
# When the extractor rephrases a fact just enough to break the FactId =
# SHA1(content) exact match, the semantic layer catches it via cosine
# similarity and routes it through cross-session confirmation instead of
# leaving the fact stuck at single-source confidence.
[extraction]
dedup_cosine_threshold = 0.95

[heat]
decay_rate = 0.03
min_threshold = 0.2

[session]
timeout_seconds = 1800
pending_overflow_threshold = 20
# Pending→Accepted promotion cadence. Lowering from 60s to 15s shortens the
# window a freshly-extracted fact waits before the watcher re-runs the NLI /
# confidence scan, at the cost of more NLI cycles per minute.
scan_interval_seconds = 15

# SMOS Dreaming Agent — autonomous LLM-driven memory audit. Disabled by
# default; flip `enabled = true` to opt in. The agent runs on a cron schedule,
# reviews stored facts via rig tool-calling, applies bounded mutations
# (deletions, merges, conflict flags), and writes a markdown report.
[audit]
enabled = false
schedule = "0 3 * * *"
llm_provider = "cloud"
cloud_model = "z-ai/glm-4.6"
# Set this to "${OPENROUTER_API_KEY}" to keep the secret out of TOML; the
# dreaming module expands the placeholder via std::env::var at runtime.
cloud_api_key = ""
cloud_base_url = "https://openrouter.ai/api/v1"
local_model = "qwen3.5-2b"
local_url = "http://localhost:28082"
max_deletions_per_run = 50
max_merges_per_run = 100
# rig 0.14's PromptRequest defaults to single-turn (max_depth = 0); without a
# non-zero multi-turn depth the tool-calling loop never engages and the audit
# fails with `MaxDepthError: (reached limit: 0)` on the first prompt that needs
# a tool. 10 is the canonical headroom for a full audit sweep.
max_tool_rounds = 10
# Defaults to ~/.smos/reports; uncomment to override.
# report_dir = "~/.smos/reports"

# ---------------------------------------------------------------------------
# llama.cpp auto-launch.
# ---------------------------------------------------------------------------
#
# When `auto_launch = true`, `smos serve` spawns the configured
# `llama-server` processes at startup so the operator does not have to start
# them by hand. Each service's port is probed first; an already-running
# server is reused. Disable if you launch llama-server yourself or use a
# remote / cloud provider.
[llama_cpp]
binary = "C:/Users/redmi/AppData/Local/Microsoft/WinGet/Packages/ggml.llamacpp_Microsoft.Winget.Source_8wekyb3d8bbwe/llama-server.exe"
auto_launch = true
# Unload models from VRAM after this many seconds idle (5 min default).
# Set to 0 to disable. The flag is only appended when the underlying
# `llama-server` build advertises support (probed via `--help`).
idle_timeout_seconds = 300

[llama_cpp.embedding]
model_path = "~/.smos/models/v5-nano-retrieval-Q8_0.gguf"
port = 28081
# ctx-size 8192 = nano max seq. `--pooling last` is REQUIRED: the nano model
# is an EuroBERT base using last-token pooling. Needs llama.cpp >= 2026-02-26
# (PR #19826 EuroBERT architecture); an older build fails to load it.
extra_args = ["--ctx-size", "8192", "--embeddings", "--pooling", "last"]

[llama_cpp.reranker]
model_path = "~/.smos/models/qwen3-reranker-0.6b-q8_0.gguf"
port = 28181
# All three flags are required by the working Voodisss Qwen3-Reranker-0.6B
# GGUF build (which declares pooling_type=RANK in its metadata):
#   --reranking  exposes /v1/rerank (otherwise HTTP 501).
#   --pooling rank  selects rank pooling. Without it llama-server defaults
#     to a different mode and /v1/rerank returns inverted / near-zero scores
#     (the regression that motivated the GGUF swap — see llama.cpp #16407).
#   --embedding  (SINGULAR — distinct from the embedding service's
#     `--embeddings` plural). Enables the score output.
extra_args = ["--ctx-size", "8192", "--reranking", "--pooling", "rank", "--embedding"]

[llama_cpp.extraction]
model_path = "~/.smos/models/qwen3.5-2b-q5_k_m.gguf"
port = 28082
# MTP speculative decode: `-np 1` is REQUIRED (parallel slots >1 unsupported
# with draft-mtp), `--no-mmproj` skips the vision encoder (text-only model).
extra_args = ["--ctx-size", "32768", "--spec-type", "draft-mtp", "--spec-draft-n-max", "3", "-np", "1", "--no-mmproj"]

# ---------------------------------------------------------------------------
# Git-backed memory sync.
# ---------------------------------------------------------------------------
#
# SMOS writes extracted facts to a local git repository at `local_path` as
# markdown files (one fact per .md) and commits after every FinalizeSession
# — always, regardless of remote configuration. This gives the operator an
# offline audit trail of the on-disk memory under `~/.smos/git`.
#
# Pushing to a remote is opt-in: set `auto_push = true` AND configure an
# `origin` remote on the local checkout yourself via
#   git -C ~/.smos/git remote add origin <url>
# SMOS never clones and does not know any remote URL. The push fails open
# (warn log, no error) when `origin` is missing.
#
# `smos import git <path>` reads the same layout back from any local
# directory (a freshly cloned memory repo, a backup, or an in-progress
# checkout) so two SMOS instances can share memory through git.
#
# Note: `repo_url` (deprecated since v0.7.0) is silently ignored for
# backward compat — remove it from your config when convenient.
[git]
branch = "main"
auto_push = false
local_path = "~/.smos/git"
disable_gpg_sign = true            # SMOS commits are unsigned by default
